plugins {
    id 'org.springframework.boot' version '3.3.12'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
    id 'maven-publish'
    id 'jacoco'
    id "org.sonarqube" version "4.2.0.3129"
}


group = 'com.humana.domain.ecrphoneattribute'
version = '2.0.0.453'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
//    compileOnly {
//        extendsFrom annotationProcessor
//    }
}

repositories {
    mavenLocal()
    maven {
        url 'https://humana.jfrog.io/artifactory/plugins-release'
        credentials {
            username System.getenv('ARTIFACTORY_USERNAME')
            password System.getenv('ARTIFACTORY_PASSWORD')
        }
    }
}
ext {
    set('springCloudVersion', "2023.0.3")
    set('spring-security.version', "6.2.3")
    set('spring-framework.version', "6.2.0")
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework:spring-beans:6.2.3'
    implementation 'org.springframework:spring-context:6.2.3'
    implementation 'org.springframework:spring-core:6.2.3'
    implementation 'org.springframework:spring-expression:6.2.3'


    implementation('org.springframework.boot:spring-boot-starter-web:3.4.0')
            {
                exclude group: 'org.springframework', module: 'spring-webmvc'
                exclude group: 'org.springframework', module: 'spring-web'
                //exclude group: 'org.apache.tomcat.embed', module: 'tomcat-embed-core'
                //exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
            }
    implementation('org.springframework:spring-webmvc:6.2.10')
    implementation('org.springframework:spring-web:6.2.10')

    implementation 'org.springframework.boot:spring-boot-starter-aop:3.4.0'

    //implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation('org.springframework.kafka:spring-kafka:3.3.2') {
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
    }
    implementation 'org.apache.kafka:kafka-clients:4.0.0'
    //implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.5'
    implementation('org.apache.avro:avro:1.12.0') {
    }
    implementation 'org.springframework:spring-webflux:6.2.2'
    //implementation 'io.projectreactor.netty:reactor-netty-http'
    compileOnly 'org.projectlombok:lombok'
//	developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation('org.springframework.boot:spring-boot-starter-test:3.4.3') {
        exclude group: 'org.xmlunit', module: 'xmlunit-core'
    }
    testImplementation 'org.xmlunit:xmlunit-core:2.10.0'
    testImplementation 'org.mockito:mockito-core:5.1.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    implementation 'net.bytebuddy:byte-buddy:1.12.0'
    implementation 'org.xerial.snappy:snappy-java:1.1.10.7'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.4.3'

    implementation(group: 'io.netty', name: 'netty-handler') {
        version {
            strictly '4.1.118.Final'
        }
    }
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "MACS.ConsentAndPreferences.MACS.ConsentAndPreferences.EcrPhoneAttributeWorkflow"
        property "sonar.host.url", "http://analysis-devops.humana.com"
        property "sonar.login", System.getenv("SONARQUBE_TOKEN")
        property "sonar.java.binaries", "${layout.buildDirectory.get()}/classes/java/main"
        property "sonar.junit.reportsPath", "${layout.buildDirectory.get()}/test-results/test/"
        property "sonar.jacoco.reportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.coverage.exclusions',
                "**/com/humana/domain/ecrphoneattribute/App.java," +
                        "**/com/humana/domain/ecrphoneattribute/client/**," +
                        "**/com/humana/domain/ecrphoneattribute/config/**," +
                        "**/com/humana/domain/ecrphoneattribute/contract/**," +
                        "**/com/humana/domain/ecrphoneattribute/constants/**," +
                        "**/com/humana/domain/ecrphoneattribute/dto/**," +
                        "**/com/humana/domain/ecrphoneattribute/entity/**," +
                        "**/com/humana/domain/ecrphoneattribute/exceptions/**," +
                        "**/com/humana/domain/ecrphoneattribute/repository/**," +
                        "**/com/humana/domain/ecrphoneattribute/interfaces/**," +
                        "**/com/humana/domain/ecrphoneattribute/model/**," +
                        "**/com/humana/domain/ecrphoneattribute/service/avro/**," +
                        "**/com/humana/domain/ecrphoneattribute/util/VaultPropertySourceFactory.java"
    }
}

apply plugin: 'jacoco'

test {
    useJUnitPlatform()

    jacocoTestReport {
        reports {
            xml.required.set(true)
            html.required.set(true)
            xml.destination file("${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml")
            html.destination file("${layout.buildDirectory.get()}/jacocoReport")
        }
        finalizedBy jacocoTestCoverageVerification
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        "**/com/humana/domain/ecrphoneattribute/App.java," +
                                "**/com/humana/domain/ecrphoneattribute/client/**," +
                                "**/com/humana/domain/ecrphoneattribute/config/**," +
                                "**/com/humana/domain/ecrphoneattribute/contract/**," +
                                "**/com/humana/domain/ecrphoneattribute/constants/**," +
                                "**/com/humana/domain/ecrphoneattribute/dto/**," +
                                "**/com/humana/domain/ecrphoneattribute/entity/**," +
                                "**/com/humana/domain/ecrphoneattribute/exceptions/**," +
                                "**/com/humana/domain/ecrphoneattribute/repository/**," +
                                "**/com/humana/domain/ecrphoneattribute/interfaces/**," +
                                "**/com/humana/domain/ecrphoneattribute/model/**," +
                                "**/com/humana/domain/ecrphoneattribute/util/VaultPropertySourceFactory.java"
                ])
            }))
        }
    }
    test.finalizedBy jacocoTestReport
    //jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    jvmArgs += [
            "--add-opens", "java.base/java.lang=ALL-UNNAMED",
            "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
            "--add-opens", "java.base/java.util=ALL-UNNAMED"
    ]
}
tasks.named('test') {
    useJUnitPlatform()
}

tasks.sonarqube.dependsOn = []

tasks.register('ins-cp-mgmt-ecrphoneattribute-workflow') {
    doLast {
        println 'Running ins-cp-mgmt-ecrphoneattribute-workflow task'
    }
}
