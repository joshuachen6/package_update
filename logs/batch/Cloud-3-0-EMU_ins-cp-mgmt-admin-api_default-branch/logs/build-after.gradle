plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'application'
    id 'jacoco'
    id "org.sonarqube" version "4.2.0.3129"
}
configurations.all {
    resolutionStrategy.dependencySubstitution {
        // package-update: managed dependencySubstitution block (safe to regenerate)
        substitute module('io.netty:netty-codec') using module('io.netty:netty-codec:4.1.136.Final')
    }
}

configurations.all {
    resolutionStrategy {
        // package-update: managed force block (safe to regenerate)
        force 'at.yawk.lz4:lz4-java:1.11.1'
    
        force 'io.netty:netty-codec:4.1.136.Final'
}
}


group = 'com.humana.cnp'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    maven {
        url 'https://humana.jfrog.io/artifactory/plugins-release'
        credentials {
            username System.getenv('ARTIFACTORY_USERNAME')
            password System.getenv('ARTIFACTORY_PASSWORD')
        }
    }
    maven {
        url "https://humana.jfrog.io/artifactory/ins-cp-mgmt-gradle-virtual"
        credentials {
            username System.getenv('ARTIFACTORY_USERNAME')
            password System.getenv('ARTIFACTORY_PASSWORD')
        }
    }
}

ext {
    set('springCloudVersion', "2025.0.0")
    set('spring-framework.version', "6.2.19")
    set('jackson-bom.version', "2.22.1")
    set('logback.version', "1.6.0")
    set('spring-kafka.version', "3.3.16")
    set('tomcat.version', "10.1.57")
}

dependencies {
    implementation('com.humana.cpms.cds:cds-utilities:1.0.3') {
        exclude group: 'io.netty', module: 'netty-codec'
        exclude group: 'io.netty', module: 'netty-handler'
    }
    implementation 'io.netty:netty-codec:4.1.133.Final'
    implementation 'io.netty:netty-handler:4.2.15.Final'
    implementation('org.springframework.boot:spring-boot-starter-actuator') {
        exclude group: 'io.micrometer', module: 'micrometer-core'
        exclude group: 'io.micrometer', module: 'micrometer-commons'
    }
    implementation 'io.micrometer:micrometer-core:1.17.0-RC1'
    implementation 'io.micrometer:micrometer-commons:1.17.0-RC1'
    implementation('org.springframework.boot:spring-boot-starter-data-mongodb') {
        exclude group: 'org.springframework.data', module: 'spring-data-commons'
        exclude group: 'org.springframework.data', module: 'spring-data-mongodb'
    }
    implementation 'org.springframework.data:spring-data-mongodb:4.5.12'
    implementation 'org.springframework.data:spring-data-commons:3.5.12'

    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.apache.tomcat.embed', module: 'tomcat-embed-websocket'
    }
    implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.55'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    compileOnly 'org.projectlombok:lombok'
    //developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.0.2'
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation('org.springframework.kafka:spring-kafka') {
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
    }
    implementation 'org.apache.kafka:kafka-clients:4.2.0'
    implementation 'org.apache.avro:avro:1.12.1'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.1'
}

sonarqube {
    properties {
        property "sonar.projectKey", "MACS.ConsentAndPreferences.ins-cp-mgmt-admin-api"
        property "sonar.host.url", "http://analysis-devops.humana.com"
        property "sonar.login", System.getenv("SONARQUBE_TOKEN")
        property "sonar.java.binaries", "${layout.buildDirectory.get()}/classes/java/main"
        property "sonar.junit.reportsPath", "${layout.buildDirectory.get()}/test-results/test/"
        property "sonar.jacoco.reportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.coverage.exclusions',
                "**/com/humana/cnp/ConsentAndPreferenceTemplateApplication*," +
                        "**/com/humana/cnp/entity/*," +
                        "**/com/humana/cnp/config/**," +
                        "**/com/humana/cnp/constants/**," +
                        "**/com/humana/cnp/dto/**," +
                        "**/com/humana/cnp/logging/**," +
                        "**/com/humana/cnp/repository/**," +
                        "**/com/humana/cnp/exceptions/**," +
                        "**/com/humana/cnp/enums/**," +
                        "**/com/humana/cnp/annotations/**," +
                        "**/com/humana/cnp/dataseeder/**," +
                        "**/com/humana/cnp/filter/**," +
                        "**/com/humana/cnp/service/avro/**," +
                        "**/com/humana/cnp/util/VaultPropertySourceFactory.java"
        //property 'sonar.exclusions', "**/com/humana/cnp/avro/**"
    }
}

apply plugin: 'jacoco'

test {
    useJUnitPlatform()

    jacocoTestReport {
        reports {
            xml.required.set(true)
            html.required.set(true)
            xml.destination file("${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml")
            html.destination file("${layout.buildDirectory.get()}/jacocoReport")
        }
        finalizedBy jacocoTestCoverageVerification
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        "com/humana/cnp/ConsentAndPreferenceTemplateApplication.class",
                        "com/humana/cnp/entity/*",
                        "com/humana/cnp/config/**",
                        "com/humana/cnp/constants/**",
                        "com/humana/cnp/dto/**",
                        "com/humana/cnp/logging/**",
                        "com/humana/cnp/repository/**",
                        "com/humana/cnp/exceptions/**",
                        "com/humana/cnp/enums/**",
                        "com/humana/cnp/annotations/**",
                        "com/humana/cnp/dataseeder/**",
                        "com/humana/cnp/filter/**",
                        "**/com/humana/cnp/service/avro/**,",
                        "com/humana/cnp/util/VaultPropertySourceFactory.java"
                ])
            }))
        }
    }
    test.finalizedBy jacocoTestReport
    jvmArgs += [
            "--add-opens", "java.base/java.lang=ALL-UNNAMED",
            "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
            "--add-opens", "java.base/java.util=ALL-UNNAMED"
    ]
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.sonarqube.dependsOn = []

application {
    mainClass = 'com.humana.cnp.ConsentAndPreferenceTemplateApplication'
}
tasks.register('ins-cp-mgmt-admin-api') {
    doLast {
        println 'Running ins-cp-mgmt-admin-api task'
    }
}
