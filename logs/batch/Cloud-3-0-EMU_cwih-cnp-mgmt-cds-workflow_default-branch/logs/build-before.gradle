buildscript {
    repositories {
        maven {
            url 'https://humana.jfrog.io/artifactory/cwih-cnp-mgmt-gradle-virtual'
            credentials {
                username System.getenv('ARTIFACTORY_USERNAME')
                password System.getenv('ARTIFACTORY_PASSWORD')
            }
        }

    }
    dependencies {
        //Check for the latest version here: http://plugins.gradle.org/plugin/com.jfrog.artifactory
        classpath "org.jfrog.buildinfo:build-info-extractor-gradle:4+"
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'application'
    id 'jacoco'
    id "org.sonarqube" version "5.1.0.4882"

}

group = 'com.humana.domain.cds'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

allprojects {
    apply plugin: "com.jfrog.artifactory"
}
artifactory {
    contextUrl = "${System.getenv('ARTIFACTORY_SOURCE')}"
    //The base Artifactory URL if not overridden by the publisher/resolver
    publish {
        repository {
            repoKey = 'cwih-cnp-mgmt-gradle-local'
            username = "${System.getenv('ARTIFACTORY_USERNAME')}"
            password = "${System.getenv('ARTIFACTORY_PASSWORD')}"
            maven = true
        }
    }
    resolve {
        repository {
            repoKey = 'cwih-cnp-mgmt-gradle-virtual'
            username = "${System.getenv('ARTIFACTORY_USERNAME')}"
            password = "${System.getenv('ARTIFACTORY_PASSWORD')}"
            maven = true
        }
    }
}
repositories {
    mavenLocal()
    maven {
        url 'https://humana.jfrog.io/artifactory/cwih-cnp-mgmt-gradle-virtual'
        credentials {
            username System.getenv('ARTIFACTORY_USERNAME')
            password System.getenv('ARTIFACTORY_PASSWORD')
        }
    }
}

ext {
    set('springCloudVersion', "2024.0.1")
    set('spring-framework.version', "6.2.17")
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation('org.springframework.boot:spring-boot-starter-web:3.5.13')
            {
                exclude group: 'org.apache.tomcat.embed', module: 'tomcat-embed-core'
            }
    implementation 'org.springframework.boot:spring-boot-starter-aop:3.5.13'
    //Vit Fix CVE-2025-11226
    implementation "ch.qos.logback:logback-core:1.5.25"
    implementation "ch.qos.logback:logback-classic:1.5.25"
    // fix of GHSA-72hv-8253-57qq
    implementation "com.fasterxml.jackson.core:jackson-core:2.21.1"
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation('org.springframework.kafka:spring-kafka:3.3.6') {
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
    }
    implementation 'org.apache.kafka:kafka-clients:4.2.0'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.54'
    implementation('org.apache.avro:avro:1.12.0') {
        //exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
    }

    implementation(group: 'org.apache.commons', name: 'commons-lang3') {
        version {
            strictly '3.18.0'
        }
    }
    implementation 'org.springframework:spring-webflux:6.2.17'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation('org.springframework.boot:spring-boot-starter-test:3.5.13') {
        exclude group: 'org.xmlunit', module: 'xmlunit-core'
    }
    testImplementation 'org.xmlunit:xmlunit-core:2.10.1'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    implementation 'org.xerial.snappy:snappy-java:1.1.10.7'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.13'
}

application {
    mainClass = 'com.humana.domain.cds.IngestionServiceApplication'
}
sonarqube {
    properties {
        property "sonar.projectKey", "IntegratedHealth.ConsentAndPreferences.IntegratedHealth.ConsentAndPreferences.CdsWorkflow"
        property "sonar.host.url", "http://analysis-devops.humana.com"
        property "sonar.login", System.getenv("SONARQUBE_TOKEN")
        property "sonar.java.binaries", "${layout.buildDirectory.get()}/classes/java/main"
        property "sonar.junit.reportsPath", "${layout.buildDirectory.get()}/test-results/test/"
        property "sonar.jacoco.reportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.coverage.exclusions',
                "**/com/humana/domain/cds/IngestionServiceApplication.java," +
                        "**/com/humana/domain/cds/config/**," +
                        "**/com/humana/domain/cds/constants/**," +
                        "**/com/humana/domain/cds/contract/**," +
                        "**/com/humana/domain/cds/dto/**," +
                        "**/com/humana/domain/cds/entity/**," +
                        "**/com/humana/domain/cds/enums/**," +
                        "**/com/humana/domain/cds/exceptions/**," +
                        "**/com/humana/domain/cds/logging/**," +
                        "**/com/humana/domain/cds/model/**," +
                        "**/com/humana/domain/cds/repository/**," +
                        "**/com/humana/domain/cds/service/avro/**," +
                        "**/com/humana/domain/cds/util/**"
    }
}

apply plugin: 'jacoco'

test {
    useJUnitPlatform()

    jacocoTestReport {
        reports {
            xml.required.set(true)
            html.required.set(true)
            xml.destination file("${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml")
            html.destination file("${layout.buildDirectory.get()}/jacocoReport")
        }
        finalizedBy jacocoTestCoverageVerification
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        "**/com/humana/domain/cds/entity/**," +
                                "**/com/humana/domain/cds/config/**," +
                                "**/com/humana/domain/cds/constants/**," +
                                "**/com/humana/domain/cds/contract/**," +
                                "**/com/humana/domain/cds/dto/**," +
                                "**/com/humana/domain/cds/entity/**," +
                                "**/com/humana/domain/cds/enums/**," +
                                "**/com/humana/domain/cds/exceptions/**," +
                                "**/com/humana/domain/cds/logging/**," +
                                "**/com/humana/domain/cds/model/**," +
                                "**/com/humana/domain/cds/repository/**," +
                                "**/com/humana/domain/cds/service/avro/**," +
                                "**/com/humana/domain/cds/util/**"
                ])
            }))
        }
    }
    test.finalizedBy jacocoTestReport
}


tasks.named('test') {
    useJUnitPlatform()
}

tasks.sonarqube.dependsOn = []