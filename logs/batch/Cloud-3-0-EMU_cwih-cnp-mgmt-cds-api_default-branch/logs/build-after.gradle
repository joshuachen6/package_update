buildscript {
    configurations.all {
        resolutionStrategy {
            // package-update: managed buildscript force block (safe to regenerate)
            force 'org.apache.cxf:cxf-core:4.2.2'
            force 'org.springframework.data:spring-data-commons:3.5.13'
            force 'org.apache.neethi:neethi:3.2.3'
            force 'org.springframework.hateoas:spring-hateoas:2.5.3'
            force 'org.springframework.data:spring-data-mongodb:4.5.13'
            force 'commons-beanutils:commons-beanutils:1.11.0'
            force 'org.lz4:lz4-java:1.8.0'
            force 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
            force 'org.codehaus.plexus:plexus-utils:3.6.1'
            force 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
        
            force 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
}
    }

    repositories {
        mavenLocal()
        maven {
            url = "${ARTIFACTORY_SOURCE}"
            credentials {
                username System.getenv('ARTIFACTORY_USERNAME')
                password System.getenv('ARTIFACTORY_PASSWORD')
            }
        }
    }
}

plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'maven-publish'
    id 'jacoco'
    id "org.sonarqube" version "5.1.0.4882"
}
configurations.all {
    resolutionStrategy.dependencySubstitution {
        // package-update: managed dependencySubstitution block (safe to regenerate)
        substitute module('org.springframework.data:spring-data-commons') using module('org.springframework.data:spring-data-commons:3.5.13')
        substitute module('org.springframework.data:spring-data-mongodb') using module('org.springframework.data:spring-data-mongodb:4.5.13')
    
        substitute module('com.fasterxml.jackson.core:jackson-databind') using module('com.fasterxml.jackson.core:jackson-databind:2.21.5')
}
}

configurations.all {
    resolutionStrategy {
        // package-update: managed force block (safe to regenerate)
        force 'org.apache.cxf:cxf-core:4.2.2'
        force 'org.springframework.data:spring-data-commons:3.5.13'
        force 'org.apache.neethi:neethi:3.2.3'
        force 'org.springframework.hateoas:spring-hateoas:2.5.3'
        force 'org.springframework.data:spring-data-mongodb:4.5.13'
        force 'commons-beanutils:commons-beanutils:1.11.0'
        force 'org.lz4:lz4-java:1.8.0'
        force 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
        force 'org.codehaus.plexus:plexus-utils:3.6.1'
        force 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
    
        force 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
}
}


group = 'com.humana.domain'
version = '2.0.0.709'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext {
    set('springCloudVersion', "2025.0.1")
    set('spring-framework.version', "6.2.19") // Overriding default Spring Boot version if necessary

    // Define repeated exclusions here
    coverageExclusions = [
            "**/com/humana/domain/contact/decision/App.java",
            "**/com/humana/domain/contact/decision/client/**",
            "**/com/humana/domain/contact/decision/config/**",
            "**/com/humana/domain/contact/decision/constants/**",
            "**/com/humana/domain/contact/decision/contract/**",
            "**/com/humana/domain/contact/decision/dto/**",
            "**/com/humana/domain/contact/decision/entity/**",
            "**/com/humana/domain/contact/decision/exceptions/**",
            "**/com/humana/domain/contact/decision/repository/**",
            "**/com/humana/domain/contact/decision/interfaces/**",
            "**/com/humana/domain/contact/decision/model/**",
            "**/com/humana/domain/contact/decision/util/VaultPropertySourceFactory.java"
    ]
    set('micrometer.version', "1.17.0")
    set('netty.version', "4.2.16.Final")
    set('spring-framework.version', "6.2.19")
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    maven {
        url = "${ARTIFACTORY_SOURCE}"
        credentials {
            username System.getenv('ARTIFACTORY_USERNAME')
            password System.getenv('ARTIFACTORY_PASSWORD')
        }
    }
}

dependencies {
    // --- Spring Boot Starters ---
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- Internal & Domain Libraries ---
    implementation "com.humana.domain:contact-decision-model-v20:${version}"
    implementation "com.humana.domain:contact-decision-api-v20:${version}"
    implementation 'com.humana.eai:eai-chassis-rest:2.6.3'

    // --- Observability & Logging ---
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.micrometer:context-propagation'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    implementation(group: 'ch.qos.logback', name: 'logback-classic') { version { strictly '1.6.0' } }
    implementation(group: 'ch.qos.logback', name: 'logback-core') { version { strictly '1.6.0' } }

    // --- Resilience & Reactive ---
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    implementation 'io.projectreactor:reactor-core'
    implementation 'io.projectreactor.netty:reactor-netty-core:1.2.8'
    implementation 'io.projectreactor.netty:reactor-netty-http:1.2.8'

    // --- Documentation & API ---
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.5'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.26'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'

    // --- Jackson & Serialization ---
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.0'
    implementation(group: 'com.fasterxml.jackson.core', name: 'jackson-databind') { version { strictly '2.22.1' } }
    implementation(group: 'com.fasterxml.jackson.core', name: 'jackson-annotations') { version { strictly '2.22' } }
    implementation(group: 'com.fasterxml.jackson.core', name: 'jackson-core') { version { strictly '2.22.1' } }

    // --- Kafka & Avro ---
    implementation('org.springframework.kafka:spring-kafka:3.3.16') {
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
    }
    implementation 'org.apache.kafka:kafka-clients:4.3.1'
    implementation 'org.apache.avro:avro:1.12.0'

    // --- Security & Utilities ---
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'org.webjars:webjars-locator-core:0.59'
    implementation(group: 'org.yaml', name: 'snakeyaml') { version { strictly '2.4' } }
    implementation(group: 'org.apache.commons', name: 'commons-lang3') { version { strictly '3.18.0' } }
    implementation(group: 'org.bouncycastle', name: 'bcprov-jdk18on') { version { strictly '1.85' } }
    implementation(group: 'com.google.protobuf', name: 'protobuf-java') { version { strictly "[4.30.1]" } }
    implementation(group: 'com.launchdarkly', name: 'launchdarkly-java-server-sdk') { version { strictly '7.5.0' } }
    implementation(group: 'org.apache.cxf', name: 'cxf-rt-transports-http') { version { strictly '4.2.2' } }
    implementation(group: 'com.github.jknack', name: 'handlebars') { version { strictly "[4.4.0]" } }
    implementation 'org.springframework.cloud:spring-cloud-contract-shade:4.2.1'

    // --- Netty (Strict versions for vulnerability fixes) ---
    ['netty-codec', 'netty-codec-http', 'netty-handler'].each {
        implementation(group: 'io.netty', name: it) { version { strictly '4.2.16.Final' } }
    }
    implementation(group: 'io.netty', name: 'netty-codec-http2') { version { strictly '4.2.16.Final' } }

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Testing ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner:4.2.1'
    testImplementation(group: 'com.google.guava', name: 'guava') { version { strictly '33.4.8-jre' } }
    implementation(group: 'com.jayway.jsonpath', name: 'json-path') { version { strictly '2.9.0' } }
    implementation 'org.eclipse.angus:jakarta.mail:2.0.4'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "IntegratedHealth.ConsentAndPreferences.IntegratedHealth.ConsentAndPreferences.CdsApi"
        property "sonar.host.url", "http://analysis-devops.humana.com"
        property "sonar.login", System.getenv("SONARQUBE_TOKEN")
        property "sonar.java.binaries", "${layout.buildDirectory.get()}/classes/java/main"
        property "sonar.junit.reportsPath", "${layout.buildDirectory.get()}/test-results/test/"
        property "sonar.jacoco.reportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.coverage.exclusions", coverageExclusions.join(",")
        property "sonar.exclusions", "**/com/humana/domain/contact/decision/contract/**"
    }
}

test {
    useJUnitPlatform()
    jvmArgs += [
            "--add-opens", "java.base/java.lang=ALL-UNNAMED",
            "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
            "--add-opens", "java.base/java.util=ALL-UNNAMED"
    ]
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
        html.required.set(true)
        xml.destination file("${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml")
        html.destination file("${layout.buildDirectory.get()}/jacocoReport")
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExclusions)
        }))
    }
    finalizedBy jacocoTestCoverageVerification
}

tasks.sonarqube.dependsOn = []

tasks.register('cwih-cnp-mgmt-cds-api') {
    doLast {
        println 'Running cwih-cnp-mgmt-cds-api task'
    }
}
