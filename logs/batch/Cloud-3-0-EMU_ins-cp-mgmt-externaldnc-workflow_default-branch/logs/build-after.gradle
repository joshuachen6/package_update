buildscript {
    configurations.all {
        resolutionStrategy {
            // package-update: managed buildscript force block (safe to regenerate)
            force 'org.lz4:lz4-java:1.8.0'
            force 'org.springframework.data:spring-data-mongodb:4.5.13'
            force 'org.springframework.data:spring-data-commons:3.5.13'
            force 'org.apache.commons:commons-lang3:3.20.0'
            force 'org.assertj:assertj-core:3.27.7'
        
            force 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
}
    }

    repositories {
        maven {
            url 'https://humana.jfrog.io/artifactory/ins-cp-mgmt-gradle-virtual'
            credentials {
                username System.getenv('ARTIFACTORY_USERNAME')
                password System.getenv('ARTIFACTORY_PASSWORD')
            }
        }

    }
    dependencies {
        //Check for the latest version here: http://plugins.gradle.org/plugin/com.jfrog.artifactory
        classpath "org.jfrog.buildinfo:build-info-extractor-gradle:4+"
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'application'
    id 'jacoco'
    id "org.sonarqube" version "5.1.0.4882"

}
configurations.all {
    resolutionStrategy.dependencySubstitution {
        // package-update: managed dependencySubstitution block (safe to regenerate)
        substitute module('org.springframework.data:spring-data-mongodb') using module('org.springframework.data:spring-data-mongodb:4.5.13')
        substitute module('org.springframework.data:spring-data-commons') using module('org.springframework.data:spring-data-commons:3.5.13')
    
        substitute module('com.fasterxml.jackson.core:jackson-databind') using module('com.fasterxml.jackson.core:jackson-databind:2.21.5')
}
}

configurations.all {
    resolutionStrategy {
        // package-update: managed force block (safe to regenerate)
        force 'org.lz4:lz4-java:1.8.0'
        force 'org.springframework.data:spring-data-mongodb:4.5.13'
        force 'org.springframework.data:spring-data-commons:3.5.13'
        force 'org.apache.commons:commons-lang3:3.20.0'
        force 'org.assertj:assertj-core:3.27.7'
    
        force 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
}
}


group = 'com.humana.domain.externaldnc'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

allprojects {
    apply plugin: "com.jfrog.artifactory"
}
artifactory {
    contextUrl = "${System.getenv('ARTIFACTORY_SOURCE')}"   //The base Artifactory URL if not overridden by the publisher/resolver
    publish {
        repository {
            repoKey = 'ins-cp-mgmt-gradle-local'
            username = "${System.getenv('ARTIFACTORY_USERNAME')}"
            password = "${System.getenv('ARTIFACTORY_PASSWORD')}"
            maven = true
        }
    }
    resolve {
        repository {
            repoKey = 'ins-cp-mgmt-gradle-virtual'
            username = "${System.getenv('ARTIFACTORY_USERNAME')}"
            password = "${System.getenv('ARTIFACTORY_PASSWORD')}"
            maven = true
        }
    }
}
repositories {
    mavenLocal()
    maven {
        url 'https://humana.jfrog.io/artifactory/ins-cp-mgmt-gradle-virtual'
        credentials {
            username System.getenv('ARTIFACTORY_USERNAME')
            password System.getenv('ARTIFACTORY_PASSWORD')
        }
    }
}

ext {
    set('springCloudVersion', "2023.0.4")
    set('jackson-bom.version', "2.22.1")
    set('micrometer.version', "1.17.0")
    set('tomcat.version', "10.1.57")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation('org.springframework.boot:spring-boot-starter-data-mongodb:3.4.0') {
        exclude group: 'org.springframework', module: 'spring-beans'
        exclude group: 'org.springframework', module: 'spring-context'
        exclude group: 'org.springframework', module: 'spring-core'
        exclude group: 'org.springframework', module: 'spring-expression'
    }
    implementation 'org.springframework:spring-beans:6.2.19'
    implementation 'org.springframework:spring-context:6.2.19'
    implementation 'org.springframework:spring-core:6.2.19'
    implementation 'org.springframework:spring-expression:6.2.19'


    implementation('org.springframework.boot:spring-boot-starter-web:3.4.0')
            {
                exclude group: 'org.springframework', module: 'spring-webmvc'
                exclude group: 'org.springframework', module: 'spring-web'
                exclude group: 'org.apache.tomcat.embed', module: 'tomcat-embed-core'
                //exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
            }
    implementation('org.springframework:spring-webmvc:6.2.19')
    implementation('org.springframework:spring-web:6.2.19')
    implementation 'org.springframework.boot:spring-boot-starter-aop:3.4.0'
    implementation('org.springframework.kafka:spring-kafka:3.3.16') {
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
    }
    implementation 'org.apache.kafka:kafka-clients:4.3.1'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.57'
    implementation('org.apache.avro:avro:1.12.0') {
        //exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
    }
    implementation 'org.springframework:spring-webflux:6.2.19'
    //implementation 'io.projectreactor.netty:reactor-netty-http'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation('org.springframework.boot:spring-boot-starter-test:3.4.0') {
        exclude group: 'org.xmlunit', module: 'xmlunit-core'
    }
    testImplementation 'org.xmlunit:xmlunit-core:2.10.0'
    testImplementation 'org.mockito:mockito-core:5.1.1'
    implementation 'org.xerial.snappy:snappy-java:1.1.10.7'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.4.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.4'

//    implementation(group: 'io.netty', name: 'netty-handler') {
//        version {
//            strictly '4.1.118.Final'
//        }
//    }
}

application {
    mainClass = 'com.humana.domain.externalDnc.IngestionServiceApplication'
}
sonarqube {
    properties {
        property "sonar.projectKey", "MACS.ConsentAndPreferences.ExternalDncWorkflow"
        property "sonar.host.url", "http://analysis-devops.humana.com"
        property "sonar.login", System.getenv("SONARQUBE_TOKEN")
        property "sonar.java.binaries", "${layout.buildDirectory.get()}/classes/java/main"
        property "sonar.junit.reportsPath", "${layout.buildDirectory.get()}/test-results/test/"
        property "sonar.jacoco.reportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.coverage.exclusions',
                "**/com/humana/domain/externalDnc/IngestionServiceApplication.java," +
                        "**/com/humana/domain/externalDnc/config/**," +
                        "**/com/humana/domain/externalDnc/constants/**," +
                        "**/com/humana/domain/externalDnc/contract/**," +
                        "**/com/humana/domain/externalDnc/dto/**," +
                        "**/com/humana/domain/externalDnc/entity/**," +
                        "**/com/humana/domain/externalDnc/enums/**," +
                        "**/com/humana/domain/externalDnc/exceptions/**," +
                        "**/com/humana/domain/externalDnc/logging/**," +
                        "**/com/humana/domain/externalDnc/model/**," +
                        "**/com/humana/domain/externalDnc/repository/**," +
                        "**/com/humana/domain/externalDnc/service/avro/**," +
                        "**/com/humana/domain/externalDnc/util/**"
    }
}

apply plugin: 'jacoco'

test {
    useJUnitPlatform()

    jacocoTestReport {
        reports {
            xml.required.set(true)
            html.required.set(true)
            xml.destination file("${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml")
            html.destination file("${layout.buildDirectory.get()}/jacocoReport")
        }
        finalizedBy jacocoTestCoverageVerification
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        "**/com/humana/domain/externalDnc/entity/**," +
                                "**/com/humana/domain/externalDnc/config/**," +
                                "**/com/humana/domain/externalDnc/constants/**," +
                                "**/com/humana/domain/externalDnc/contract/**," +
                                "**/com/humana/domain/externalDnc/dto/**," +
                                "**/com/humana/domain/externalDnc/entity/**," +
                                "**/com/humana/domain/externalDnc/enums/**," +
                                "**/com/humana/domain/externalDnc/exceptions/**," +
                                "**/com/humana/domain/externalDnc/logging/**," +
                                "**/com/humana/domain/externalDnc/model/**," +
                                "**/com/humana/domain/externalDnc/repository/**," +
                                "**/com/humana/domain/externalDnc/service/avro/**," +
                                "**/com/humana/domain/externalDnc/util/**"
                ])
            }))
        }
    }
    test.finalizedBy jacocoTestReport
}


tasks.named('test') {
    useJUnitPlatform()
}
