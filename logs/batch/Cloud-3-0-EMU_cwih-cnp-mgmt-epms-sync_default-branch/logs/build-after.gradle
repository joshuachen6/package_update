buildscript {
    configurations.all {
        resolutionStrategy {
            force 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
        }
    }

    repositories {
        maven {
            url 'https://humana.jfrog.io/artifactory/cwih-cnp-mgmt-gradle-virtual'
            credentials {
                username System.getenv('ARTIFACTORY_USERNAME')
                password System.getenv('ARTIFACTORY_PASSWORD')
            }
        }

    }
    dependencies {
        //Check for the latest version here: http://plugins.gradle.org/plugin/com.jfrog.artifactory
        classpath "org.jfrog.buildinfo:build-info-extractor-gradle:4+"
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'application'
    id 'jacoco'
    id "org.sonarqube" version "7.2.2.6593"

}
configurations.all {
    resolutionStrategy.dependencySubstitution {
        substitute module('com.fasterxml.jackson.core:jackson-databind') using module('com.fasterxml.jackson.core:jackson-databind:2.21.5')
    }
}

configurations.all {
    resolutionStrategy {
            force 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
    }
}


group = 'com.humana.domain.epms'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

allprojects {
    apply plugin: "com.jfrog.artifactory"
}
repositories {
    mavenLocal()
    maven {
        url 'https://humana.jfrog.io/artifactory/cwih-cnp-mgmt-gradle-virtual'
        credentials {
            username System.getenv('ARTIFACTORY_USERNAME')
            password System.getenv('ARTIFACTORY_PASSWORD')
        }

    }

}

ext {
    set('springCloudVersion', "2025.0.0")
    set('jackson-bom.version', "2.22.1")
    set('logback.version', "1.5.38")
    set('netty.version', "4.2.16.Final")
    set('spring-framework.version', "6.2.19")
    set('spring-kafka.version', "3.3.16")
    set('tomcat.version', "10.1.57")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-clients'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.24'
    implementation "ch.qos.logback:logback-core:1.5.38"//Vit Fix CVE-2025-11226
    implementation "ch.qos.logback:logback-classic:1.5.38"//Vit Fix CVE-2025-11226
    implementation 'org.apache.avro:avro:1.12.0'
    implementation 'io.projectreactor.netty:reactor-netty-http:1.3.2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.xmlunit', module: 'xmlunit-core'
    }
    testImplementation 'org.xmlunit:xmlunit-core:2.11.0'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    implementation 'org.xerial.snappy:snappy-java:1.1.10.8'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation(group: 'org.apache.commons', name: 'commons-lang3') {
        version {
            strictly '3.20.0'
        }
    }
}

application {
    mainClass = 'com.humana.domain.epms.EpmsSyncApplication'
}
sonarqube {
    properties {
        property "sonar.projectKey", "IntegratedHealth.ConsentAndPreferences.cwih-cnp-mgmt-epms-sync"
        property "sonar.host.url", "http://analysis-devops.humana.com"
        property "sonar.login", System.getenv("SONARQUBE_TOKEN")
        property "sonar.java.binaries", "${layout.buildDirectory.get()}/classes/java/main"
        property "sonar.junit.reportsPath", "${layout.buildDirectory.get()}/test-results/test/"
        property "sonar.jacoco.reportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.coverage.exclusions',
                "**/com/humana/domain/epms/EpmsSyncApplication.java," +
                        "**/com/humana/domain/epms/config/**," +
                        "**/com/humana/domain/epms/constants/**," +
                        "**/com/humana/domain/epms/contract/**," +
                        "**/com/humana/domain/epms/dto/**," +
                        "**/com/humana/domain/epms/enums/**," +
                        "**/com/humana/domain/epms/exceptions/**," +
                        "**/com/humana/domain/epms/logging/**," +
                        "**/com/humana/domain/epms/kafka/avro/**," +
                        "**/com/humana/domain/epms/util/VaultPropertySourceFactory.java"
    }
}

apply plugin: 'jacoco'

test {
    useJUnitPlatform()

    jacocoTestReport {
        reports {
            xml.required.set(true)
            html.required.set(true)
            xml.destination file("${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml")
            html.destination file("${layout.buildDirectory.get()}/jacocoReport")
        }
        finalizedBy jacocoTestCoverageVerification
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        "**/com/humana/domain/epms/config/**," +
                                "**/com/humana/domain/epms/constants/**," +
                                "**/com/humana/domain/epms/contract/**," +
                                "**/com/humana/domain/epms/dto/**," +
                                "**/com/humana/domain/epms/enums/**," +
                                "**/com/humana/domain/epms/exceptions/**," +
                                "**/com/humana/domain/epms/logging/**," +
                                "**/com/humana/domain/epms/kafka/avro/**," +
                                "**/com/humana/domain/epms/util/VaultPropertySourceFactory.java"
                ])
            }))
        }
    }
    test.finalizedBy jacocoTestReport
}


tasks.named('test') {
    useJUnitPlatform()
}

tasks.sonarqube.dependsOn = []
