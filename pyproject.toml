[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "package-update"
version = "0.1.0"
description = "JFrog-driven dependency remediation for Node.js and Gradle projects"
requires-python = ">=3.13"
dependencies = [
    "azure-core==1.41.0",
    "azure-identity==1.25.3",
    "certifi==2026.6.17",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "cryptography==49.0.0",
    "idna==3.18",
    "loguru>=0.7",
    "openpyxl>=3.1.5",
    "msal==1.37.0",
    "msal-extensions==1.3.1",
    "pycparser==3.0",
    "PyJWT==2.13.0",
    "PyQt6==6.11.0",
    "PyQt6-Qt6==6.11.1",
    "PyQt6_sip==13.11.1",
    "requests==2.34.2",
    "typing_extensions==4.15.0",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["remediation*", "output*", "parsers*", "pipeline*", "registry*", "resolver*", "shared*", "ui*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF059"]
